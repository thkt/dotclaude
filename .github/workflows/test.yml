name: Test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # Nothing here pushes, and a token left in .git/config travels with an upload.
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      # The two remaining shell tests exec hooks that open with a zsh shebang.
      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh

      # node_modules is not tracked; the lockfile is. The root install puts the lint
      # binaries into node_modules/.bin, where bunx finds them. The textlint hook runs
      # from this same root, where .textlintrc.json sits beside node_modules.
      - name: Install
        run: bun install --frozen-lockfile

      # typescript は JS 依存にあるので、上の Install がそのまま入れる。版の固定は package.json/bun.lock 側。
      - name: Type check
        run: bunx tsc

      - name: Test classification
        run: bun run check:classification

      - name: Bun tests
        run: bun run test

      # Runs only on a failed suite (#589). A test that builds a git repo under
      # tempfile.TemporaryDirectory has failed here in teardown with
      # "Directory not empty: 'pack'", and the same commit passed on rerun. The values below
      # are the ones a local run cannot observe: macOS reproduced 0 failures in 20 runs.
      - name: git settings on failure
        if: failure()
        run: |
          git --version
          echo "gc.auto=$(git config --get gc.auto || echo unset)"
          echo "gc.autoDetach=$(git config --get gc.autoDetach || echo unset)"
          echo "TMPDIR=${TMPDIR:-unset}"
          find "${TMPDIR:-/tmp}" -maxdepth 4 -name pack -path '*objects*' -exec ls -la {} +

      # glob でなく find なのは、bash 3.2 に globstar が無く ** の階層解釈が版で割れるため。
      # 階層が増えても suite を落とさない。-t が実行行を stderr へ出す。
      - name: Shell tests
        run: find hooks sandbox -name '*.test.sh' -print0 | xargs -0 -r -n1 -t bash

      # 3 つとも hook か手元でしか走っておらず、指摘が溜まっても誰も気付かなかった。
      # oxlint と textlint は devDependency なので、上の Install がそのまま入れる。
      # --format=github は error を PR の annotation にする。
      - name: oxlint
        run: bunx oxlint --format=github

      # 認知的複雑度の規則 1 本だけを持つ。formatter も他の lint 規則も biome.json が
      # 止めている。--reporter=github は oxlint の --format=github と同じ役。
      - name: biome
        run: bunx biome lint --reporter=github

      - name: ast-grep scan
        run: bunx ast-grep scan . .ja

      - name: ast-grep rule tests
        run: bunx ast-grep test --skip-snapshot-tests

      # クォートしたまま渡し、glob の展開は textlint 側にさせる。シェルに展開させると
      # globstar の有無で対象ファイル数が変わる。
      - name: textlint
        run: bunx textlint '.ja/**/*.md'

      # rumdl は JS 依存に無いので版を直に固定する。`fmt` でなく `check` なのは、
      # コードスパン内の末尾スペースと見出しレベルで、自動修正が内容を壊す実例が出たため (#329)。
      - name: rumdl
        run: pipx run --spec rumdl==0.2.58 rumdl check .
