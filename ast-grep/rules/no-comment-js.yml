id: no-comment-js
language: JavaScript
severity: error
message: >-
  Delete this comment and carry its intent in names and test names. To keep it, make it one line starting with "// why-not: " or "// source: " and get thkt's permission in the PR.
rule:
  kind: comment
  not:
    any:
      - regex: '^/// <reference'
      - regex: '^// biome-ignore[\s-]'
      - regex: '^// oxlint-disable'
      - regex: '^// why-not: \S'
      - regex: '^// source: https?://'
files:
  - '**/*.js'
ignores:
  - '**/fixtures/**'
  - 'workflows/**'
  - '.ja/workflows/**'
